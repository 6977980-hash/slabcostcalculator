<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" width="100%" height="100%">
  <rect width="800" height="400" rx="12" fill="#0F172A" />
  
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Concrete Slab Reinforcement: Rebar Grid vs. Welded Wire Mesh (WWM)</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Comparison of structural load distribution, tensile strength, and installation clearance</text>

  <!-- Left Card: Deformed Steel Rebar Grid -->
  <g transform="translate(40, 95)">
    <rect width="345" height="270" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#60A5FA">Deformed Steel Rebar (#3, #4, #5)</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#94A3B8">Primary structural reinforcement for tensile load resistance</text>

    <!-- Visual Grid -->
    <g transform="translate(20, 68)">
      <rect width="305" height="120" rx="6" fill="#0F172A" stroke="#334155" />
      <!-- Rebar Grid Lines -->
      <line x1="30" y1="40" x2="275" y2="40" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
      <line x1="30" y1="80" x2="275" y2="80" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
      <line x1="80" y1="15" x2="80" y2="105" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
      <line x1="152" y1="15" x2="152" y2="105" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
      <line x1="225" y1="15" x2="225" y2="105" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
      <!-- Tie Wire Intersections -->
      <circle cx="80" cy="40" r="4" fill="#E2E8F0" />
      <circle cx="152" cy="40" r="4" fill="#E2E8F0" />
      <circle cx="225" cy="40" r="4" fill="#E2E8F0" />
      <circle cx="80" cy="80" r="4" fill="#E2E8F0" />
      <circle cx="152" cy="80" r="4" fill="#E2E8F0" />
      <circle cx="225" cy="80" r="4" fill="#E2E8F0" />
    </g>

    <!-- Details -->
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#CBD5E1">• #4 Rebar (1/2") @ 12"–18" grid centers</text>
    <text x="20" y="235" font-family="sans-serif" font-size="12" fill="#CBD5E1">• Held on rebar chairs at mid-depth of slab</text>
    <text x="20" y="255" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Ideal for: Driveways, Garages, Structural Pads</text>
  </g>

  <!-- Right Card: Welded Wire Reinforcement (WWR/WWM) -->
  <g transform="translate(415, 95)">
    <rect width="345" height="270" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#34D399">Welded Wire Mesh (6x6 - W1.4/W2.9)</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#94A3B8">Secondary crack control and temperature shrinkage restraint</text>

    <!-- Visual Grid -->
    <g transform="translate(20, 68)">
      <rect width="305" height="120" rx="6" fill="#0F172A" stroke="#334155" />
      <!-- Wire Mesh Grid -->
      <line x1="20" y1="25" x2="285" y2="25" stroke="#34D399" stroke-width="2" />
      <line x1="20" y1="50" x2="285" y2="50" stroke="#34D399" stroke-width="2" />
      <line x1="20" y1="75" x2="285" y2="75" stroke="#34D399" stroke-width="2" />
      <line x1="20" y1="100" x2="285" y2="100" stroke="#34D399" stroke-width="2" />
      <line x1="45" y1="10" x2="45" y2="110" stroke="#34D399" stroke-width="2" />
      <line x1="95" y1="10" x2="95" y2="110" stroke="#34D399" stroke-width="2" />
      <line x1="145" y1="10" x2="145" y2="110" stroke="#34D399" stroke-width="2" />
      <line x1="195" y1="10" x2="195" y2="110" stroke="#34D399" stroke-width="2" />
      <line x1="245" y1="10" x2="245" y2="110" stroke="#34D399" stroke-width="2" />
    </g>

    <!-- Details -->
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#CBD5E1">• 6" x 6" welded wire sheets or rolls</text>
    <text x="20" y="235" font-family="sans-serif" font-size="12" fill="#CBD5E1">• Fast installation; must be supported on chairs</text>
    <text x="20" y="255" font-family="sans-serif" font-size="12" font-weight="600" fill="#34D399">Ideal for: Patios, Walkways, Light Shed Floors</text>
  </g>
</svg>
