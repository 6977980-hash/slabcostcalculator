<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" width="100%" height="100%">
<rect width="800" height="450" rx="12" fill="#0F172A" />
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Resurfacing vs. Extending an Existing Concrete Slab</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Overlay bonding layer compared to a doweled cold-joint extension</text>
  <!-- Resurfacing overlay -->
  <text x="220" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="middle">Resurfacing Overlay</text>
  <rect x="110" y="180" width="220" height="55" fill="#64748B"/>
  <rect x="110" y="173" width="220" height="7" fill="#38BDF8"/>
  <rect x="110" y="162" width="220" height="11" fill="#94A3B8"/>
  <text x="220" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#F1F5F9" text-anchor="middle">1/4&#8221;&#8211;2&#8243; overlay over bonding agent</text>
  <text x="220" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">on existing sound slab</text>

  <!-- Extension with dowels -->
  <text x="580" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="middle">Doweled Extension</text>
  <rect x="470" y="165" width="105" height="70" fill="#64748B"/>
  <rect x="585" y="165" width="105" height="70" fill="#475569"/>
  <line x1="560" y1="195" x2="600" y2="195" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="560" y1="212" x2="600" y2="212" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <text x="522" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#F1F5F9" text-anchor="middle">Existing slab</text>
  <text x="637" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#F1F5F9" text-anchor="middle">New pour</text>
  <text x="580" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FCD34D" text-anchor="middle">Smooth dowel bars, greased</text>
  <text x="580" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FCD34D" text-anchor="middle">one side, at the cold joint</text>

  <rect x="90" y="300" width="620" height="90" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="115" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F1F5F9">Resurfacing fixes cosmetic wear on a structurally sound slab &#8212; it will not fix cracks that are still moving.</text>
  <text x="115" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F1F5F9">Extending ties new concrete to old with dowels so both sections move together under load.</text>

</svg>
