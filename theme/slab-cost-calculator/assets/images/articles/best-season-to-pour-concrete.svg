<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" width="100%" height="100%">
<rect width="800" height="450" rx="12" fill="#0F172A" />
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Best Time of Year to Pour a Concrete Slab</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Illustrative U.S. temperate-climate suitability &#8212; always check your own local forecast</text>
  <text x="130" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F1F5F9">Ideal placement window: ambient <tspan font-weight="800" fill="#4ADE80">50&#176;F&#8211;85&#176;F</tspan>, no rain in the pour/finish window</text>
  <text x="130" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94A3B8">Below <tspan font-weight="800" fill="#7DD3FC">40&#176;F</tspan>: ACI 306 cold-weather protection required (blankets/heated enclosure)</text>
  <text x="130" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94A3B8">Above <tspan font-weight="800" fill="#FCD34D">90&#176;F</tspan>: ACI 305 hot-weather precautions (early pour times, fog spray, evaporation retardant)</text>

  <rect x="90" y="230" width="48" height="40" rx="3" fill="#38BDF8" opacity="0.85"/><text x="114" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Jan</text><rect x="142" y="230" width="48" height="40" rx="3" fill="#38BDF8" opacity="0.85"/><text x="167" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Feb</text><rect x="195" y="230" width="48" height="40" rx="3" fill="#22C55E" opacity="0.85"/><text x="219" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Mar</text><rect x="248" y="230" width="48" height="40" rx="3" fill="#22C55E" opacity="0.85"/><text x="272" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Apr</text><rect x="300" y="230" width="48" height="40" rx="3" fill="#22C55E" opacity="0.85"/><text x="324" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">May</text><rect x="352" y="230" width="48" height="40" rx="3" fill="#F59E0B" opacity="0.85"/><text x="377" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Jun</text><rect x="405" y="230" width="48" height="40" rx="3" fill="#F59E0B" opacity="0.85"/><text x="429" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Jul</text><rect x="458" y="230" width="48" height="40" rx="3" fill="#F59E0B" opacity="0.85"/><text x="482" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Aug</text><rect x="510" y="230" width="48" height="40" rx="3" fill="#22C55E" opacity="0.85"/><text x="534" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Sep</text><rect x="562" y="230" width="48" height="40" rx="3" fill="#22C55E" opacity="0.85"/><text x="587" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Oct</text><rect x="615" y="230" width="48" height="40" rx="3" fill="#38BDF8" opacity="0.85"/><text x="639" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Nov</text><rect x="668" y="230" width="48" height="40" rx="3" fill="#38BDF8" opacity="0.85"/><text x="692" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Dec</text>

  <rect x="90" y="295" width="14" height="14" fill="#38BDF8"/><text x="112" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F1F5F9">Cold &#8211; needs protection</text>
  <rect x="290" y="295" width="14" height="14" fill="#22C55E"/><text x="312" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F1F5F9">Ideal window</text>
  <rect x="450" y="295" width="14" height="14" fill="#F59E0B"/><text x="472" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F1F5F9">Hot &#8211; needs precautions</text>

  <text x="400" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle">Spring and fall give the widest margin for error in most U.S. climate zones</text>

