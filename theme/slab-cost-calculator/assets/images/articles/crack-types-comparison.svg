<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" width="100%" height="100%">
<rect width="800" height="450" rx="12" fill="#0F172A" />
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Common Concrete Slab Crack Types &amp; Where They Start</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Plastic shrinkage, drying-shrinkage control joints, and settlement cracking compared</text>
  <!-- Slab 1: Plastic shrinkage crack (surface, random, early) -->
  <rect x="60" y="150" width="200" height="100" fill="#64748B" rx="2" stroke="#475569" stroke-width="1" />
  <path d="M100 150 L130 180 L110 210 L145 250" stroke="#EF4444" stroke-width="2.5" fill="none" />
  <path d="M180 150 L165 180 L195 220" stroke="#EF4444" stroke-width="2" fill="none" />
  <text x="160" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FCA5A5" text-anchor="middle">Plastic Shrinkage</text>
  <text x="160" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">Random, hairline</text>
  <text x="160" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">hours after pour</text>

  <!-- Slab 2: Control joint (planned, straight) -->
  <rect x="300" y="150" width="200" height="100" fill="#64748B" rx="2" stroke="#475569" stroke-width="1" />
  <rect x="395" y="150" width="10" height="70" fill="#0F172A" />
  <path d="M395 220 L400 250 L405 250" stroke="#F59E0B" stroke-width="2" fill="none" />
  <text x="400" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FCD34D" text-anchor="middle">Control Joint</text>
  <text x="400" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">Planned &#8226; cut 1/4 depth</text>
  <text x="400" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">spaced 2&#8211;3&#215; thickness (in) in ft</text>

  <!-- Slab 3: Settlement crack (diagonal, full depth, uneven) -->
  <rect x="540" y="150" width="200" height="100" fill="#64748B" rx="2" stroke="#475569" stroke-width="1" />
  <rect x="540" y="210" width="200" height="40" fill="#4B5563" />
  <path d="M600 150 L640 250" stroke="#EF4444" stroke-width="3.5" fill="none" />
  <text x="640" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FCA5A5" text-anchor="middle">Settlement Crack</text>
  <text x="640" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">Diagonal, full-depth</text>
  <text x="640" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">uncompacted sub-base</text>

  <rect x="60" y="330" width="680" height="30" fill="#2E2419" rx="4" />
  <text x="400" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D6D3D1" text-anchor="middle">Compacted Subgrade</text>

  <text x="400" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle">Prevention: compact the sub-base, control water-cement ratio, and cut joints within hours of finishing</text>

</svg>
