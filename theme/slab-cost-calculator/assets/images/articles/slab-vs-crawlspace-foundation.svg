<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" width="100%" height="100%">
<rect width="800" height="450" rx="12" fill="#0F172A" />
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Slab-on-Grade vs. Crawl Space Foundation</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Structural cross-section comparison, cost range, and climate fit</text>
  <!-- Slab-on-grade -->
  <text x="220" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="middle">Slab-on-Grade</text>
  <rect x="110" y="150" width="220" height="15" fill="#334155"/>
  <rect x="110" y="165" width="10" height="55" fill="#475569"/>
  <rect x="320" y="165" width="10" height="55" fill="#475569"/>
  <rect x="120" y="150" width="200" height="15" fill="#64748B"/>
  <rect x="110" y="220" width="220" height="18" fill="#2E2419"/>
  <text x="220" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#F1F5F9" text-anchor="middle">4&#8211;6&#8243; slab + thickened edge footing</text>
  <text x="220" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">poured directly on grade</text>

  <!-- Crawl space -->
  <text x="580" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="middle">Crawl Space</text>
  <rect x="470" y="130" width="220" height="15" fill="#334155"/>
  <rect x="470" y="145" width="16" height="75" fill="#78350F"/>
  <rect x="674" y="145" width="16" height="75" fill="#78350F"/>
  <rect x="470" y="220" width="220" height="18" fill="#2E2419"/>
  <text x="580" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#F1F5F9" text-anchor="middle">18&#8221;&#8211;36&#8221; open crawl space</text>
  <text x="580" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">utility access on stem-wall footing</text>

  <rect x="90" y="300" width="620" height="90" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="115" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F1F5F9">Slab-on-grade: <tspan font-weight="800" fill="#4ADE80">$4&#8211;$14/sq ft</tspan> &#8226; faster build, no under-floor moisture, best in warm/mild climates</text>
  <text x="115" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F1F5F9">Crawl space: <tspan font-weight="800" fill="#FCD34D">$5&#8211;$16/sq ft</tspan> &#8226; easier utility access &amp; repairs, suits sloped lots &amp; deep frost lines</text>

</svg>
