<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" width="100%" height="100%">
<rect width="800" height="450" rx="12" fill="#0F172A" />
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Concrete Slab Permit Process &amp; Typical Fees</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Most jurisdictions follow this five-step sequence for new slabs, driveways, and patios</text><circle cx="153" cy="155" r="20" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
<text x="153" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle">1</text>
<line x1="176" y1="155" x2="261" y2="155" stroke="#334155" stroke-width="2"/>
<text x="153" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9" text-anchor="middle">Check Local Code</text>
<text x="153" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Setback, size &amp;</text>
<text x="153" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">impervious-surface limits</text>
<circle cx="279" cy="155" r="20" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
<text x="279" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle">2</text>
<line x1="302" y1="155" x2="387" y2="155" stroke="#334155" stroke-width="2"/>
<text x="279" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9" text-anchor="middle">Submit Application</text>
<text x="279" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Site plan + dimensions</text>
<text x="279" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">to building dept.</text>
<circle cx="405" cy="155" r="20" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
<text x="405" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle">3</text>
<line x1="428" y1="155" x2="513" y2="155" stroke="#334155" stroke-width="2"/>
<text x="405" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9" text-anchor="middle">Pay Permit Fee</text>
<text x="405" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">$50 &#8211; $350 typical</text>
<text x="405" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">(varies by scope)</text>
<circle cx="531" cy="155" r="20" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
<text x="531" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle">4</text>
<line x1="554" y1="155" x2="639" y2="155" stroke="#334155" stroke-width="2"/>
<text x="531" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9" text-anchor="middle">Inspection</text>
<text x="531" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Forms, base &amp; rebar</text>
<text x="531" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">checked in place</text>
<circle cx="657" cy="155" r="20" fill="#1E3A8A" stroke="#38BDF8" stroke-width="2"/>
<text x="657" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle">5</text>
<text x="657" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#F1F5F9" text-anchor="middle">Pour &amp; Sign-Off</text>
<text x="657" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Final inspection closes</text>
<text x="657" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">the permit</text>
  <rect x="90" y="270" width="620" height="110" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="115" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FCD34D">Typical permit fee ranges (varies widely by municipality)</text>
  <text x="115" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F1F5F9">&#8226; Driveway / new impervious surface: <tspan font-weight="700">$50 &#8211; $200</tspan></text>
  <text x="115" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F1F5F9">&#8226; General grading / land-disturbance permit: <tspan font-weight="700">$50 &#8211; $400</tspan></text>
  <text x="115" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F1F5F9">&#8226; Larger structural (garage / foundation) permits: often <tspan font-weight="700">0.5% &#8211; 2%</tspan> of project cost</text>

</svg>
