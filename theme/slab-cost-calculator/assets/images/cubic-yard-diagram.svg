<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" width="100%" height="100%">
  <rect width="800" height="400" rx="12" fill="#0F172A" />
  
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Understanding Concrete Volume: What is 1 Cubic Yard?</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">1 Cubic Yard (yd³) = 27 Cubic Feet (ft³) = 3 ft × 3 ft × 3 ft = 0.7646 Cubic Meters (m³)</text>

  <!-- Isometric 3D 1-Cubic-Yard Cube with 27 sub-cubes -->
  <g transform="translate(140, 100)">
    <!-- Main Big Cube Box Representation -->
    <!-- Top Face -->
    <polygon points="180,20 300,70 180,120 60,70" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="60,70 180,120 180,240 60,190" fill="#2563EB" stroke="#1D4ED8" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="180,120 300,70 300,190 180,240" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2" />

    <!-- Grid subdivision on Top Face (3x3 = 9 squares) -->
    <line x1="100" y1="53.3" x2="220" y2="103.3" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="140" y1="36.6" x2="260" y2="86.6" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="140" y1="86.6" x2="260" y2="36.6" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="100" y1="103.3" x2="220" y2="53.3" stroke="#93C5FD" stroke-width="1.5" />

    <!-- Grid subdivision on Left Face -->
    <line x1="100" y1="86.6" x2="100" y2="206.6" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="140" y1="103.3" x2="140" y2="223.3" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="60" y1="110" x2="180" y2="160" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="60" y1="150" x2="180" y2="200" stroke="#93C5FD" stroke-width="1.5" />

    <!-- Grid subdivision on Right Face -->
    <line x1="220" y1="103.3" x2="220" y2="223.3" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="260" y1="86.6" x2="260" y2="206.6" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="180" y1="160" x2="300" y2="110" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="180" y1="200" x2="300" y2="150" stroke="#60A5FA" stroke-width="1.5" />

    <!-- Dimension callouts -->
    <text x="32" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">3 ft (Length)</text>
    <text x="315" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">3 ft (Width)</text>
    <text x="185" y="260" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">3 ft (Height)</text>
  </g>

  <!-- Explanatory Breakdown Card -->
  <g transform="translate(480, 95)">
    <rect width="280" height="270" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Quick Rule-of-Thumb Yields:</text>
    
    <g transform="translate(20, 50)">
      <rect width="240" height="42" rx="6" fill="#0F172A" />
      <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">At 4" Thick Slab:</text>
      <text x="12" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#38BDF8">1 yd³ covers ~81 sq. ft.</text>
    </g>

    <g transform="translate(20, 102)">
      <rect width="240" height="42" rx="6" fill="#0F172A" />
      <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">At 5" Thick Slab:</text>
      <text x="12" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#60A5FA">1 yd³ covers ~65 sq. ft.</text>
    </g>

    <g transform="translate(20, 154)">
      <rect width="240" height="42" rx="6" fill="#0F172A" />
      <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">At 6" Thick Slab:</text>
      <text x="12" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#34D399">1 yd³ covers ~54 sq. ft.</text>
    </g>

    <g transform="translate(20, 206)">
      <rect width="240" height="50" rx="6" fill="#0F172A" />
      <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FCD34D">Bagged Equivalents (approx):</text>
      <text x="12" y="36" font-family="sans-serif" font-size="12" font-weight="700" fill="#FDE68A">45 × 80lb bags  |  60 × 60lb bags</text>
    </g>
  </g>
</svg>
