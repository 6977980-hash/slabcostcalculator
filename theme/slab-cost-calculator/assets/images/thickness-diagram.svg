<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" width="100%" height="100%">
  <rect width="800" height="400" rx="12" fill="#0F172A" />
  
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Recommended Concrete Slab Thickness by Project Application</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Choosing structural depth based on compressive load, soil conditions, and traffic ratings</text>

  <!-- 4-inch Column -->
  <g transform="translate(40, 95)">
    <rect width="160" height="270" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="15" width="130" height="65" rx="6" fill="#3B82F6" />
    <text x="80" y="55" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFF" text-anchor="middle">4 INCH</text>
    <text x="80" y="105" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Light Duty</text>
    <line x1="25" y1="120" x2="135" y2="120" stroke="#334155" />
    <text x="80" y="145" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Patios &amp; Walkways</text>
    <text x="80" y="170" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Small Storage Sheds</text>
    <text x="80" y="195" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Hot Tub Pads (Light)</text>
    <text x="80" y="220" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Foot traffic only</text>
    <rect x="20" y="238" width="120" height="24" rx="4" fill="#0F172A" />
    <text x="80" y="254" font-family="sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Min 3,000 PSI Mix</text>
  </g>

  <!-- 5-inch Column -->
  <g transform="translate(225, 95)">
    <rect width="160" height="270" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="2" />
    <rect x="15" y="15" width="130" height="65" rx="6" fill="#2563EB" />
    <text x="80" y="55" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFF" text-anchor="middle">5 INCH</text>
    <text x="80" y="105" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Standard Vehicle</text>
    <line x1="25" y1="120" x2="135" y2="120" stroke="#334155" />
    <text x="80" y="145" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Residential Driveway</text>
    <text x="80" y="170" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Standard 2-Car Garage</text>
    <text x="80" y="195" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Large Workshop Shed</text>
    <text x="80" y="220" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• SUVs &amp; Light Pickups</text>
    <rect x="20" y="238" width="120" height="24" rx="4" fill="#0F172A" />
    <text x="80" y="254" font-family="sans-serif" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">3,500 - 4,000 PSI</text>
  </g>

  <!-- 6-inch Column -->
  <g transform="translate(410, 95)">
    <rect width="160" height="270" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="15" width="130" height="65" rx="6" fill="#0D9488" />
    <text x="80" y="55" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFF" text-anchor="middle">6 INCH</text>
    <text x="80" y="105" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Heavy Vehicle</text>
    <line x1="25" y1="120" x2="135" y2="120" stroke="#334155" />
    <text x="80" y="145" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• RV / Boat Parking Pad</text>
    <text x="80" y="170" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Heavy Machinery Shed</text>
    <text x="80" y="195" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Commercial Driveways</text>
    <text x="80" y="220" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Heavy Delivery Trucks</text>
    <rect x="20" y="238" width="120" height="24" rx="4" fill="#0F172A" />
    <text x="80" y="254" font-family="sans-serif" font-size="10" font-weight="700" fill="#2DD4BF" text-anchor="middle">Min 4,000 PSI Mix</text>
  </g>

  <!-- 8+ inch Column -->
  <g transform="translate(595, 95)">
    <rect width="160" height="270" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="15" width="130" height="65" rx="6" fill="#D97706" />
    <text x="80" y="55" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFF" text-anchor="middle">8+ INCH</text>
    <text x="80" y="105" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Industrial / Found.</text>
    <line x1="25" y1="120" x2="135" y2="120" stroke="#334155" />
    <text x="80" y="145" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Heavy Industrial Floors</text>
    <text x="80" y="170" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Commercial Loading</text>
    <text x="80" y="195" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Thickened Edge Beams</text>
    <text x="80" y="220" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">• Semi-Tractor Parking</text>
    <rect x="20" y="238" width="120" height="24" rx="4" fill="#0F172A" />
    <text x="80" y="254" font-family="sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">4,000 - 5,000 PSI</text>
  </g>
</svg>
